[package]
name = "nget"
version = "0.0.5"
edition = "2024"
authors = ["山人 <octoape@qq.com>"]
description = "A Concurrent HTTP Downloader."
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/enjoycoding/nget"
repository = "https://github.com/enjoycoding/nget"
keywords = ["download", "http", "concurrent", "resume", "progress"]
categories = ["command-line-utilities", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18.0"
anyhow = "1.0"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.0"
humansize = { version = "2.1"}
better-panic = "0.3"
ctrlc = "3.4"
num_cpus = "1.17.0"

[dev-dependencies]
tempfile = "3.23"

[[bin]]
name = "nget"
path = "src/main.rs"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
